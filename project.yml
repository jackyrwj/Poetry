name: Poetry
options:
  bundleIdPrefix: com.raowenjie
  deploymentTarget:
    iOS: "17.0"
targets:
  Poetry:
    type: application
    platform: iOS
    sources:
      - path: Poetry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raowenjie.Poetry
        MARKETING_VERSION: 1.1
        CURRENT_PROJECT_VERSION: 5
        INFOPLIST_FILE: Poetry/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
