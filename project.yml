name: Poetry
options:
  bundleIdPrefix: com.raowenjie
  deploymentTarget:
    iOS: "17.0"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    majorVersion: 5.0.0
targets:
  Poetry:
    type: application
    platform: iOS
    sources:
      - path: Poetry
      - path: Shared
    dependencies:
      - package: RevenueCat
      - target: PoetryWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raowenjie.Poetry
        MARKETING_VERSION: 1.5
        CURRENT_PROJECT_VERSION: 14
        INFOPLIST_FILE: Poetry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Poetry/Poetry.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 9G5964XAXT
  PoetryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PoetryWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raowenjie.Poetry.PoetryWidget
        MARKETING_VERSION: 1.5
        CURRENT_PROJECT_VERSION: 14
        INFOPLIST_FILE: PoetryWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PoetryWidget/PoetryWidget.entitlements
        DEVELOPMENT_TEAM: 9G5964XAXT
        SKIP_INSTALL: YES
schemes:
  Poetry:
    build:
      targets:
        Poetry: all
    run:
      config: Debug
