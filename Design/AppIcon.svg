<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1100" viewBox="0 0 1024 1100">
<defs>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 0.08 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
<filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="6" result="d"/>
 <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="5" result="g"/><feColorMatrix in="g" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.22  0 0 0 0 0.20  0 0 0 0.35 -0.16" result="gm"/><feComposite in="gm" in2="d" operator="in" result="tex"/><feMerge><feMergeNode in="d"/><feMergeNode in="tex"/></feMerge></filter>
<radialGradient id="sun" cx="0.45" cy="0.42" r="0.6"><stop offset="0" stop-color="#CF4436"/><stop offset="1" stop-color="#B5352A"/></radialGradient>
</defs>
<rect width="1024" height="1100" fill="#F1E9DA" filter="url(#paper)"/>
<circle cx="250" cy="250" r="104" fill="url(#sun)" filter="url(#edge)"/>

